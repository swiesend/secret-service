# The simulator-backed tests talk to the TPM through TSS.Java's TCP device, which reads from the
# socket without a timeout. A simulator that stops answering holds a test in that read forever,
# and an interrupt cannot end a blocked socket read. SEPARATE_THREAD runs each test in a thread of
# its own, so the timeout fails the test anyway and the report shows the stack it was stuck in.
# A test here takes a few seconds; 60 s leaves a slow runner plenty of room.
junit.jupiter.execution.timeout.default = 60 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
