name: TPM Tests

# One workflow for everything that needs a TPM 2.0. It builds the Microsoft ms-tpm-20-ref reference
# simulator ONCE on localhost:2321 and runs both TPM test scopes against it:
#
#   1. The fast hardened + hardened-tpm2 unit/integration tests on the runner (FakeCollection-based,
#      plus the simulator-gated Tpm2KeyMaterialProviderTest / Tpm2GenerationAnchorTest). No daemon,
#      no container.
#   2. HardenedTpm2SystemTest (@Tag("system-test")) end-to-end in a gnome-keyring container, driven
#      with -Dhardened.tpm2.backend=simulator (TSS.Java's TCP simulator transport).
#
# The simulator uses the same 2321/2322 protocol TSS.Java's localTpmSimulator expects, so it serves
# both scopes. The system-test step fails loudly rather than silently-skipping: it asserts the test
# ran 3 passing, non-skipped tests, so a missing simulator or keyring cannot make the job falsely
# green (this discipline is what would have caught the F-8 anchor bug).

on:
  push:
    branches: [main, develop-2.x.x]
  pull_request:
    branches: [main, develop-2.x.x]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tpm-tests:
    runs-on: ubuntu-latest
    name: tpm-tests (ms-tpm-20-ref simulator; unit + gnome-keyring system test)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build the ms-tpm-20-ref TPM 2.0 simulator
        run: |
          set -euxo pipefail
          sudo apt-get update
          # autoconf-archive provides AX_PTHREAD (used by configure.ac); without it autoreconf
          # fails with a "possibly undefined macro: AC_SUBST/AS_IF" cascade. pkg-config + libssl-dev
          # satisfy PKG_CHECK_MODULES([LIBCRYPTO], [libcrypto]).
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config autoconf-archive libssl-dev git
          git clone --depth 1 https://github.com/microsoft/ms-tpm-20-ref.git /tmp/ms-tpm-20-ref
          cd /tmp/ms-tpm-20-ref/TPMCmd
          ./bootstrap
          ./configure
          make -j"$(nproc)"
          SIM="$(find /tmp/ms-tpm-20-ref -type f -executable -name 'tpm2-simulator' | head -n1)"
          test -n "$SIM" || { echo "::error::tpm2-simulator binary not found after build"; exit 1; }
          echo "SIMULATOR_BIN=$SIM" >> "$GITHUB_ENV"

      - name: Start the simulator on localhost:2321
        run: |
          set -euxo pipefail
          mkdir -p /tmp/tpmsim
          # The simulator writes its NVChip to the current directory; run it there. It listens on
          # 2321 (command) and 2322 (platform) -- both are what TSS.Java's localTpmSimulator uses.
          ( cd /tmp/tpmsim && nohup "$SIMULATOR_BIN" 2321 > /tmp/tpmsim/simulator.log 2>&1 & )
          # Wait until the command port accepts connections.
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/2321) 2>/dev/null; then exec 3>&- 3<&-; echo "simulator up"; break; fi
            sleep 1
            [ "$i" -eq 30 ] && { echo "::error::simulator did not open port 2321"; cat /tmp/tpmsim/simulator.log || true; exit 1; }
          done

      - name: Fast TPM unit/integration tests (runner, against the simulator)
        run: |
          set -euxo pipefail
          # hardened + hardened-tpm2 default-suite tests. hardened uses an in-memory FakeCollection
          # (no daemon); the simulator-gated Tpm2KeyMaterialProviderTest / Tpm2GenerationAnchorTest
          # exercise the sim on localhost:2321. Install core+hardened first so the reactor resolves.
          # -am is REQUIRED: without it the aggregator pom (de.swiesend:secret-service-parent) is not
          # installed, and the second, separate reactor then cannot read secret-service's descriptor.
          mvn -B -pl core,hardened -am install -DskipTests -Dgpg.skip=true
          mvn -B -pl hardened,hardened-tpm2 test -Pcoverage -Dgpg.skip=true

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-hardened
          path: |
            hardened/target/site/jacoco/**
            hardened-tpm2/target/site/jacoco/**
          if-no-files-found: ignore

      - name: Build gnome-keyring container
        run: docker build -f .github/providers/gnome-keyring/Dockerfile -t secret-service-gnome-keyring .

      - name: Run hardened-tpm2 system test (simulator-backed, live gnome-keyring)
        run: |
          set -euxo pipefail
          # --network=host lets the containerised test reach the simulator on the host's localhost:2321.
          docker run --rm --network=host \
            -v "${{ github.workspace }}":/workspace \
            -v "$HOME/.m2/repository":/root/.m2/repository \
            secret-service-gnome-keyring \
            mvn -B test -Psystem-test -pl hardened-tpm2 -am \
                -Dtest=HardenedTpm2SystemTest -Dsurefire.failIfNoSpecifiedTests=false \
                -Dhardened.tpm2.backend=simulator

      - name: Assert the TPM system test actually ran (guard against a silent skip)
        run: |
          set -euxo pipefail
          report="hardened-tpm2/target/surefire-reports/de.swiesend.secretservice.hardened.tpm2.HardenedTpm2SystemTest.txt"
          if [ ! -f "$report" ]; then
            echo "::error::no surefire report — the system test did not execute"; exit 1
          fi
          cat "$report"
          if ! grep -Eq "Tests run: 3, Failures: 0, Errors: 0, Skipped: 0" "$report"; then
            echo "::error::HardenedTpm2SystemTest did not run 3 passing, non-skipped tests (simulator or keyring not exercised)"
            exit 1
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpm-tests-diagnostics
          path: |
            /tmp/tpmsim/simulator.log
            hardened-tpm2/target/surefire-reports/**
          if-no-files-found: ignore
