name: GUI Tests

# Uses the developer GUI in tools/gui as a developer does: the smoke test connects the window to
# gnome-keyring in the gnome-keyring-dialogs container, whose keyring is the run's own and whose
# dialogs are answered through xdotool, and leaves a screenshot of each step. The GUI is a tool
# beside the library, so the job is informative and no required check.

on:
  push:
    # develop-3.x.x: the 3.x line, once 4.0 is on main.
    branches: [main, develop-2.x.x, develop-3.x.x]
  # Unfiltered on purpose: a base-branch filter skips the job, without reporting anything, for a
  # pull request stacked on another pull request.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: the job checks out the code and tests it, and writes nothing to the repository. The
# artifact upload needs no permission of the token.
permissions:
  contents: read

jobs:
  gui-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build the gnome-keyring-dialogs container
        run: docker build -f .github/providers/gnome-keyring-dialogs/Dockerfile -t secret-service-gui-test .

      # The GUI is a project of its own, outside the reactor, and takes the library from the local
      # repository: the library is installed first. The two properties tell the test that the
      # keyring is the run's own and that its dialogs are answered; without them it skips itself.
      - name: Run the smoke test of the GUI
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -v "$HOME/.m2/repository":/root/.m2/repository \
            secret-service-gui-test bash -c '
              mvn -B -q -DskipTests -Dgpg.skip=true install &&
              mvn -B -f tools/gui/pom.xml test \
                -Dsecret-service.system-test.dialogs-answered=true \
                -Dsecret-service.system-test.default-collection=throwaway'

      # Also of a run that failed or that the timeout cancelled: the last screenshot shows where.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-screenshots
          path: tools/gui/target/gui-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect provider diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-test-logs
          path: |
            target/provider-logs/
            tools/gui/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
