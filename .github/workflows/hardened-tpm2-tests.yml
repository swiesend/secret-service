name: Hardened TPM2 Tests

# Runs the hardened + hardened-tpm2 module tests against a software TPM (ibmswtpm2) so the
# seal/unseal and NV generation-counter tests actually execute -- they self-skip in the other
# workflows because no TPM is present there. These modules use an in-memory FakeCollection and the
# TPM simulator only; they do NOT need a Secret Service daemon, so no provider container is required.

on:
  push:
    branches: [main, develop-2.x.x]
  pull_request:
    branches: [main, develop-2.x.x]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hardened-tpm2-tests:
    runs-on: ubuntu-latest
    env:
      IBMTPM_REV: "1682"   # pinned ibmswtpm2 revision for reproducibility
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache ibmswtpm2 build
        id: cache-tpm
        uses: actions/cache@v4
        with:
          path: ~/ibmtpm/src/tpm_server
          key: ${{ runner.os }}-ibmswtpm2-${{ env.IBMTPM_REV }}

      - name: Build ibmswtpm2 (software TPM)
        if: steps.cache-tpm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev
          mkdir -p "$HOME/ibmtpm"
          curl -fsSL -o /tmp/ibmtpm.tar.gz \
            "https://downloads.sourceforge.net/project/ibmswtpm2/ibmtpm${IBMTPM_REV}.tar.gz"
          tar xzf /tmp/ibmtpm.tar.gz -C "$HOME/ibmtpm"
          make -C "$HOME/ibmtpm/src"

      - name: Start software TPM on localhost:2321
        run: |
          mkdir -p "$HOME/ibmtpm/run"
          ( cd "$HOME/ibmtpm/run" && rm -f NVChip && nohup "$HOME/ibmtpm/src/tpm_server" > tpm.log 2>&1 & )
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/2321) 2>/dev/null; then echo "TPM up"; exit 0; fi
            sleep 1
          done
          echo "TPM simulator did not come up on :2321"; cat "$HOME/ibmtpm/run/tpm.log" || true; exit 1

      - name: Install core + parent (no tests)
        run: mvn -B -pl core -am install -DskipTests -Dgpg.skip=true

      - name: Test hardened + hardened-tpm2 (with coverage, against the simulator)
        run: mvn -B -pl hardened,hardened-tpm2 test -Pcoverage -Dgpg.skip=true

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-hardened
          path: |
            hardened/target/site/jacoco/**
            hardened-tpm2/target/site/jacoco/**
          if-no-files-found: ignore
