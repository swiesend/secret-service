name: Docs

# Builds the MkDocs Material site from docs/ and deploys it to GitHub Pages.
# - On pull requests touching the docs: build only (strict link/anchor validation).
# - On push to main (and manual dispatch): build and deploy.
# The first deploy auto-enables Pages via actions/configure-pages (enablement: true).

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, CHANGELOG.md, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, CHANGELOG.md, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/docs.yml

      - name: Install MkDocs Material
        run: pip install mkdocs-material==9.*

      - name: Build site (strict — fails on broken links/anchors)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Deploy only from main (push or manual dispatch), never from PRs.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (auto-enable on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
