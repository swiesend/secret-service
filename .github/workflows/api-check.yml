name: API Check

# Compares the library's public API with that of the release that core/pom.xml's api-check.baseline
# names, with japicmp. It fails on a change that breaks a compiled application, binary
# incompatible; a change that breaks only the compilation, source incompatible, it lists in the job
# summary. It needs no Secret Service, so it runs on the runner.
on:
  push:
    # develop-3.x.x: the 3.x line, once 4.0 is on main.
    branches: [main, develop-2.x.x, develop-3.x.x]
  # Unfiltered on purpose: a base-branch filter skips the whole check, without reporting anything,
  # for a pull request stacked on another pull request.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's Maven is 3.9; japicmp needs 3.8.1 or later, which the provider images lack.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compare the API with the baseline release
        run: mvn -B -Papi-check -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true verify

      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f core/target/japicmp/japicmp.md ]; then
            cat core/target/japicmp/japicmp.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: japicmp-report
          path: core/target/japicmp/
          if-no-files-found: ignore
          retention-days: 7
