name: Regression Tests

on:
  push:
    branches: [main, develop-2.x.x]
  # Unfiltered on purpose: a base-branch filter skips the whole suite, without reporting
  # anything, for a pull request stacked on another pull request.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    # Normal runtime is about two minutes. The bound is generous enough that a slow runner
    # never trips it, and short enough that a hung step fails long before GitHub's
    # six-hour default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build test container
        run: docker build -f .github/providers/gnome-keyring/Dockerfile -t secret-service-test .

      - name: Run regression tests
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -v "$HOME/.m2/repository":/root/.m2/repository \
            secret-service-test
