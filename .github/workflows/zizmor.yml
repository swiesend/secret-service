name: Workflow Audit

# zizmor checks the workflows for what makes a CI attackable: an action on a tag that can be moved,
# a token with more rights than the job needs, a credential left in the checkout, an expression that
# a pull request controls inside a shell command. It fails on any finding.
on:
  push:
    # develop-3.x.x: the 3.x line, once 4.0 is on main.
    branches: [main, develop-2.x.x, develop-3.x.x]
    paths:
      - .github/**
  # A path filter, not a branch filter: a pull request stacked on another one is audited too.
  pull_request:
    paths:
      - .github/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The findings go to the job's log and annotations. GitHub's code scanning would need the
      # token to write security events.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true
          version: 1.31.0
