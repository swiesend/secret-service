name: Mutation tests

# Mutates the classes whose lines a pull request changes in core, with PIT, and reports
# on the changed lines: the job summary counts their mutants and lists each one that no
# test detects, as a warning on its line too, and the full PIT report is an artifact.
# PIT runs only the tests that need no real provider (core/pom.xml lists them), in the
# gnome-keyring image of the regression job, for the private bus of the fake provider.
# It reports and does not block: a surviving mutant is for the review to weigh.

on:
  pull_request:
    paths: [core/src/main/**, core/pom.xml, pom.xml, .github/providers/**,
            .github/scripts/pit_changed_lines.py, .github/workflows/mutation-tests.yml]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    # PIT runs the tests once for each mutant, so a change to a large class takes several
    # minutes; the bound stops a hung mutant run long before GitHub's six-hour default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge commit and its first parent, the base: their diff is the pull request.
          fetch-depth: 2
          persist-credentials: false

      - name: Find the changed lines
        id: changed
        run: |
          python3 .github/scripts/pit_changed_lines.py targets --base HEAD^1 --module core \
              --lines "$RUNNER_TEMP/changed-lines.json" >> "$GITHUB_OUTPUT"

      - name: Report that nothing changed
        if: steps.changed.outputs.classes == ''
        run: echo "No line of core's main sources changed, so there is nothing to mutate." >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Maven repository
        if: steps.changed.outputs.classes != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build test container
        if: steps.changed.outputs.classes != ''
        run: docker build -f .github/providers/gnome-keyring/Dockerfile -t secret-service-test .

      - name: Run PIT on the changed classes
        id: pit
        if: steps.changed.outputs.classes != ''
        env:
          TARGET_CLASSES: ${{ steps.changed.outputs.classes }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -v "$HOME/.m2/repository":/root/.m2/repository \
            secret-service-test \
            mvn -B -ntp -pl core test-compile org.pitest:pitest-maven:mutationCoverage \
                "-DtargetClasses=$TARGET_CLASSES" -Dthreads=4

      - name: Report the mutants on the changed lines
        if: always() && steps.changed.outputs.classes != ''
        env:
          PIT_OUTCOME: ${{ steps.pit.outcome }}
        run: |
          python3 .github/scripts/pit_changed_lines.py report --module core \
              --lines "$RUNNER_TEMP/changed-lines.json" --summary "$GITHUB_STEP_SUMMARY" \
              --pit-outcome "$PIT_OUTCOME" core/target/pit-reports/mutations.xml

      - name: Upload the PIT report
        if: always() && steps.changed.outputs.classes != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pit-report
          path: core/target/pit-reports/
          if-no-files-found: ignore
          retention-days: 14
